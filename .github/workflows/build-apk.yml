name: Build APK

# Compile, teste et publie l'APK à chaque push sur main (ou à la demande depuis l'onglet Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est préinstallé sur les machines ubuntu-latest de GitHub (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (règles, backend, application)
        run: ./gradlew --no-daemon :rules:test :backend:test :app:testDebugUnitTest

      - name: Build debug APK
        # L'adresse du backend peut être fournie dans Settings > Secrets and variables > Actions > Variables (BACKEND_URL).
        run: ./gradlew --no-daemon :app:assembleDebug -PbackendUrl="${{ vars.BACKEND_URL }}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OttawaWasteSorter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OttawaWasteSorter-apk
          path: OttawaWasteSorter.apk

      - name: Publish as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ottawa Waste Sorter — build ${{ github.run_number }}
          files: OttawaWasteSorter.apk
          prerelease: true

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
